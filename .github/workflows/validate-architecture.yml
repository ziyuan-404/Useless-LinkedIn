name: Validate architecture

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node runtime/tools/check-architecture.mjs
      - run: for f in runtime/tools/*.mjs runtime/tools/lib/*.mjs; do node --check "$f"; done
      - run: node runtime/tools/useless-linkedin.mjs --help
      - run: node --test tests/*.test.mjs
