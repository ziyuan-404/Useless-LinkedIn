<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Useless-Linkedin · 投递看板</title><link rel="stylesheet" href="/dashboard.css"><link rel="stylesheet" href="/dashboard-layout.css"></head>
<body><header><div class="brand"><span class="mark">U</span><div><strong>Useless-Linkedin</strong><small>个人求职工作台</small></div></div><span class="local">● 仅在本机运行</span></header>
<main><section class="intro"><div><p class="eyebrow">APPLICATION TRACKER</p><h1>投递看板</h1><p>从发现、材料准备到跟进，让每条记录都有出处。</p></div><button id="add" class="primary">＋ 新增记录</button></section>
<section class="stats" id="stats" aria-label="统计概览"></section>
<section class="panel"><div class="toolbar"><div><h2>申请记录</h2><p id="count" aria-live="polite"></p></div><div class="controls"><input id="search" type="search" placeholder="搜索公司、岗位、链接或 ID" aria-label="搜索申请记录"><select id="status" aria-label="按状态筛选"><option value="">全部状态</option></select><select id="initial" aria-label="按公司首字母筛选"><option value="">全部首字母</option></select><select id="sort" aria-label="排序方式"><option value="date-desc">日期：最新优先</option><option value="date-asc">日期：最早优先</option><option value="company-asc">公司：A → Z</option><option value="company-desc">公司：Z → A</option></select><button id="reset-filters" type="button" class="subtle">清除筛选</button></div></div><div class="focus-bar" id="focus-bar" role="group" aria-label="快速查看"><button type="button" data-focus="" aria-pressed="true">全部</button><button type="button" data-focus="due">到期跟进 <span id="due-count"></span></button><button type="button" data-focus="waiting">待用户 <span id="waiting-count"></span></button><button type="button" data-focus="verify">提交待核验 <span id="verify-count"></span></button><button type="button" data-focus="missing-jd">JD 待补全 <span id="jd-count"></span></button><button type="button" data-focus="conflicts">阶段冲突 <span id="conflict-count"></span></button></div><p id="load-error" role="alert" hidden></p><div class="table-wrap"><table><thead><tr><th class="date-col">日期</th><th>公司 / 岗位</th><th>状态</th><th>匹配度</th><th>下一步</th><th class="date-col">跟进日期</th><th class="action-col"></th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" class="empty" hidden>当前筛选条件下没有记录。可以清除筛选，或新增一条申请记录。</p></section>
<p class="footnote">旧 Excel 的“已提交”保留原样；“已核验提交”只统计有独立成功凭证的记录。历史数据的凭证待逐条核验。</p></main>
<dialog id="editor"><form id="record-form" method="dialog"><div class="dialog-head"><div><p class="eyebrow">APPLICATION RECORD</p><h2 id="dialog-title">申请记录</h2></div><button type="button" id="close" class="icon" aria-label="关闭">×</button></div><div id="source" class="source"></div><div id="form-fields" class="form-grid"></div><details id="history"><summary>变更历史</summary><ul id="event-list"></ul></details><div class="dialog-actions"><p id="form-error" role="alert"></p><button type="button" id="cancel">取消</button><button type="submit" class="primary">保存记录</button></div></form></dialog>
<script type="module" src="/dashboard.js"></script></body></html>
