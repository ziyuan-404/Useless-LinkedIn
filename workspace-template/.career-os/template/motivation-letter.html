<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Candidate</title><style>
  @page { size: A4 portrait; margin: 0; }
  * { box-sizing: border-box; }
  body { margin: 0; width: 210mm; min-height: 297mm; font-family: Arial, Helvetica, sans-serif; color: #283446; background: #fff; }
  .page { width: 210mm; height: 297mm; padding: 17mm 24mm 15mm; position: relative; overflow: hidden; }
  .accent { position: absolute; top: 0; left: 0; width: 210mm; height: 8mm; background: #283446; }
  .header { margin-top: 3mm; }
  .identity h1 { margin: 0 0 3mm; font-size: 22pt; letter-spacing: -.3px; }
  .personal-info { display: flex; flex-direction: column; gap: 1.1mm; color: #4d4d4f; }
  .personal-info p { margin: 0; font-size: 8.8pt; line-height: 1.35; }
  .personal-info strong { color: #283446; font-weight: 700; }
  .personal-info a { color: #4d4d4f; text-decoration: none; }
  .subject { font-size: 10.5pt; font-weight: 700; margin: 8mm 0 3mm; }

  .letter p { margin: 0 0 3.5mm; text-align: justify; }

  .signature strong { display: block; margin-top: 2mm; font-size: 10.5pt; color: #283446; }
</style></head><body><main class="page"><div class="accent"></div><header class="header"><div class="identity"><h1>Candidate</h1><div class="personal-info">Contact information to complete</div></div></header><p class="subject">Application subject</p><div class="rule"></div><section class="letter"><p>Replace with sourced application text.</p></section><div class="signature">Candidate</div></main></body></html>
