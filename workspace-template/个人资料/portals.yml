# Discovery scope. These are editable preferences, never runtime query/result caps.
version: 1
queries:
  - alternance
  - apprentissage
  - alternance no code
  - alternance low code
  - apprenticeship software
  - stage data
  - stage automatisation
query_matrix:
  contracts: [alternance, apprentissage]
  roles: [développeur, data analyst, data engineer, intelligence artificielle, automatisation, RPA, logiciel, informatique, robotique, business intelligence]
# Discovery scope does not assert willingness to relocate; assess mobility on full JD.
locations: [France]
include_keywords: [alternance, alternant, apprentissage, apprenti, apprentice, apprenticeship, stage, stagiaire, intern, internship, VIE, work-study]
role_keywords: [engineer, ingénieur, ingénieure, ingénieurs, software, web, développeuse, développeuses, développeurs, developer, developers, programmer, programmeur, programmeuse, développeur, developpeur, developer, développement, developpement, informatique, logiciel, python, java, javascript, typescript, react, node, node.js, vue, angular, data, analyst, BI, SQL, automatisation, automation, RPA, intelligence artificielle, machine learning, no code, low code, embarqué, robotique, support IT]
exclude_keywords: [senior, principal, director, head of]
discovery:
  # auto selects configured SEARXNG_URL, then BRAVE_SEARCH_API_KEY; otherwise reports missing backend.
  # Supported: auto, searxng, brave, anysearch, agent. No model calls for discovery.
  web_backend: auto
  companies_file: 个人资料/companies.yml
  # alerts_file: 个人资料/applications/automation/alert-links.json
  # searxng: {api_url: 'http://127.0.0.1:8080/search', allow_loopback: true}
  # brave: {api_token_env: BRAVE_SEARCH_API_KEY, page_size: 20}
  concurrency: 4
  web_search: true
  company_careers: true
  career_terms: '(recrutement OR careers OR jobs OR rejoindre)'
  # Budgets pause with saved tasks/cursors. 0 means unlimited, without dropped results.
  max_requests_per_run: 80
  max_pages_per_task: 0
  refresh_hours: 24
  web_refresh_hours: 168
  conditional_requests: true
  triage_max_requests: 40
  triage_refresh_hours: 0
  respect_robots: true
  min_interval_ms: 500
  retry_base_seconds: 30
  retry_max_seconds: 1800
  # Broad OR queries cover contract/role families without repeating every literal combination.
  # Remove web_queries to use every query_matrix query for web discovery too.
  web_queries:
    - '(alternance OR apprentissage OR stage OR stagiaire OR VIE OR "work study") (développeur OR informatique OR logiciel OR python OR "no code" OR "low code")'
    - '(alternance OR apprentissage OR stage OR stagiaire OR VIE OR "work study") (data OR SQL OR "business intelligence" OR "machine learning")'
    - '(alternance OR apprentissage OR stage OR stagiaire OR VIE OR "work study") (automatisation OR automation OR RPA OR "intelligence artificielle")'
    - '(alternance OR apprentissage OR stage OR stagiaire OR VIE OR "work study") (robotique OR embarqué OR "support IT")'
portals:
  - name: Welcome to the Jungle
    provider: wttj
    listing_mode: fallback
    web_search: fallback
    enabled: true
    search_domain: welcometothejungle.com
    search_url: https://www.welcometothejungle.com/fr/jobs?query={query}&country=FR
    job_pattern: /companies/[^/]+/jobs/
    wttj:
      filters: 'offices.country_code:FR'
      page_size: 100
  - name: HelloWork
    web_search: fallback
    renderer: auto
    enabled: true
    search_url: https://www.hellowork.com/fr-fr/emploi/recherche.html?k={query}&l={location}
    job_pattern: /fr-fr/emplois/\d+
  - name: Indeed France
    web_search: fallback
    renderer: auto
    enabled: true
    search_url: https://fr.indeed.com/jobs?q={query}&l={location}
    job_pattern: (viewjob|rc/clk).*jk=
  - name: LinkedIn
    web_search: fallback
    renderer: auto
    allowed_hosts: [www.linkedin.com, fr.linkedin.com, linkedin.com]
    search_domain: linkedin.com
    enabled: true
    search_url: https://www.linkedin.com/jobs/search/?keywords={query}&location={location}
    job_pattern: /jobs/view/
  - name: La Bonne Alternance
    provider: la-bonne-alternance
    api_token_env: LBA_API_TOKEN
    listing_mode: disabled
    web_search: fallback
    enabled: true
    search_domain: labonnealternance.apprentissage.beta.gouv.fr
    api:
      # Daily complete official export; streamed batches, no 450-job search cap.
      mode: export
      page_size: 500
      max_export_bytes: 536870912
      export_timeout_ms: 180000
    incremental:
      conditional: false
    # To restrict by geography/ROME use mode: search + official api.params.
    # Search is bounded by the provider and cannot prove complete coverage.
  - name: France Travail
    provider: france-travail
    enabled: true
    listing_mode: disabled
    web_search: fallback
    search_domain: francetravail.fr
    oauth:
      client_id_env: FRANCE_TRAVAIL_CLIENT_ID
      client_secret_env: FRANCE_TRAVAIL_CLIENT_SECRET
    api:
      page_size: 150
      params:
        sort: 1
    incremental:
      conditional: false
      newest_first: true
      stop_on_unchanged: true
      full_refresh_hours: 168
  - name: APEC
    enabled: true
    search_domain: apec.fr
  - name: JobTeaser
    enabled: true
    search_domain: jobteaser.com
  - name: LesJeudis
    enabled: true
    search_domain: lesjeudis.com
  - name: Talent.com
    enabled: true
    search_domain: talent.com
  - name: StudentJob
    enabled: true
    search_domain: studentjob.fr
# Additional sources have no platform registry gate. Add verified employer career_url,
# provider: greenhouse + board_token, provider: lever + site (+ region: eu),
# or a generic API with rows_path/fields/pagination. See workflows/discover-jobs.md.
